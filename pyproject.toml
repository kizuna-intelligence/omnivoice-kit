[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnivoice-kit"
version = "0.1.0"
description = "Thin training and inference kit around OmniVoice"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "peft>=0.17.0",
  "safetensors>=0.6.0",
  "soundfile>=0.13.0",
  "webdataset>=1.0.2",
]

[project.optional-dependencies]
# FP16 inference: no extra deps — base install is sufficient

# Load GPTQ-compressed models for low-VRAM inference (Python >= 3.12 required)
gptq = ["onecomp>=1.0.0"]

# Compress a model with OneCompression AutoBit to create GPTQ checkpoints
# (Python >= 3.12 required; includes gptq loading capability)
compress = ["onecomp>=1.0.0"]

[project.scripts]
omnivoice-kit = "omnivoice_kit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
